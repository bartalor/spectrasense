[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrasense"
version = "0.0.1"
description = "LTE-aware spectrum monitor for recorded I/Q captures."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "scipy>=1.12",      # ShortTimeFFT API
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["src"]
